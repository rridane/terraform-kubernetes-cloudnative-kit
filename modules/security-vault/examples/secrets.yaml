mounts:
  kv-adm:
    create: true
    secrets:
      - name: "apps/prometheus/admin"
        values:
          admin_user: "admin"
          admin_password: "@generated_password"
        external_secret:
          enabled: true
          name: "prometheus-admin-credentials"
          namespace: monitoring
      - name: "apps/grafana/admin"
        values:
          admin_user: "@generated_name"
          admin_password: "@generated_password"
        external_secret:
          enabled: true
          name: "grafana-admin-credentials"
          namespace: monitoring
      - name: "apps/keycloak/base_realm/client_credentials"
        values:
          client_id: "@generated_name"
          client_secret: "@generated_password"
        external_secret:
          enabled: true
          name: "keycloak_base_realm_client_credentials"
          namespace: auth
